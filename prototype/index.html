<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inkwell — painting prototype</title>
<style>
  :root{
    --bg:#141517;
    --panel:#1c1e21;
    --panel-2:#232629;
    --line:#2e3237;
    --line-2:#3a4046;
    --fg:#d7dade;
    --fg-dim:#8b9299;
    --fg-faint:#5d646b;
    --accent:#6ea8fe;
    --accent-dim:#2f5b9e;
    --radius:6px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--fg);
    font:12px/1.45 "Segoe UI Variable Text","Segoe UI",Inter,system-ui,sans-serif;
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
    display:grid;
    grid-template-columns:44px 1fr 232px;
    grid-template-rows:1fr 24px;
    grid-template-areas:"tools stage panel" "tools status status";
  }

  /* ---------- tool rail ---------- */
  #rail{grid-area:tools;background:var(--panel);border-right:1px solid var(--line);
        display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0}
  .tool{width:32px;height:32px;border:1px solid transparent;background:none;border-radius:var(--radius);
        color:var(--fg-dim);display:grid;place-items:center;cursor:pointer}
  .tool:hover{background:var(--panel-2);color:var(--fg)}
  .tool[aria-pressed="true"]{background:var(--accent-dim);border-color:#4d7fce;color:#eaf1ff}
  .tool svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;
            stroke-linecap:round;stroke-linejoin:round}
  .rail-sep{width:22px;height:1px;background:var(--line);margin:5px 0}
  .rail-spacer{flex:1}

  /* ---------- stage ---------- */
  #stage{grid-area:stage;position:relative;overflow:hidden;background:#0e0f10}
  #view{position:absolute;inset:0;width:100%;height:100%;display:block;
        touch-action:none;cursor:none}
  #hint{position:absolute;left:12px;top:10px;color:var(--fg-faint);pointer-events:none;
        font-size:11px;letter-spacing:.2px;transition:opacity .5s;text-shadow:0 1px 3px #000}

  /* ---------- right panel ---------- */
  #panel{grid-area:panel;background:var(--panel);border-left:1px solid var(--line);
         overflow-y:auto;overflow-x:hidden;padding:10px 12px 24px}
  #panel::-webkit-scrollbar{width:9px}
  #panel::-webkit-scrollbar-thumb{background:#33383d;border-radius:9px;border:2px solid var(--panel)}
  .sec{margin:0 0 14px}
  .sec > h2{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
            color:var(--fg-faint);margin:0 0 8px}

  .row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .row label{flex:1;color:var(--fg-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row output{font-variant-numeric:tabular-nums;color:var(--fg);min-width:42px;text-align:right;font-size:11px}
  /* Custom slider. Native <input type=range> is the thing Windows Ink ruins:
     the browser withholds the drag while it decides whether a pen contact is a
     scroll, a tap or a long-press. touch-action:none opts out of that entirely,
     and pointer capture means the very first move already counts. */
  .sl{margin:0 0 10px;touch-action:none;outline:none}
  .sl-top{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
  .sl-lab{flex:1;color:var(--fg-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sl:hover .sl-lab,.sl:focus .sl-lab{color:var(--fg)}
  .sl-val{font-variant-numeric:tabular-nums;color:var(--fg);font-size:11px;
          padding:0 4px;border-radius:3px;cursor:text}
  .sl-val:hover{background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line-2)}
  .sl-edit{width:66px;background:var(--panel-2);border:1px solid var(--accent);color:var(--fg);
           border-radius:3px;font:inherit;font-size:11px;text-align:right;padding:0 3px;outline:none}
  .sl-track{position:relative;height:16px;cursor:ew-resize;touch-action:none}
  .sl-track::before{content:"";position:absolute;left:0;right:0;top:6.5px;height:3px;
                    border-radius:3px;background:var(--line-2)}
  .sl-fill{position:absolute;left:0;top:6.5px;height:3px;border-radius:3px;background:#7d868f}
  .sl:hover .sl-fill,.sl.drag .sl-fill{background:var(--accent)}
  .sl-knob{position:absolute;top:2px;width:12px;height:12px;border-radius:50%;background:var(--fg);
           margin-left:-6px;pointer-events:none;box-shadow:0 1px 3px #0009}
  .sl:hover .sl-knob,.sl.drag .sl-knob{background:#fff}
  .sl.fine .sl-knob{box-shadow:0 0 0 3px var(--accent-dim),0 1px 3px #0009}
  .sl.fine .sl-lab::after{content:" · fine";color:var(--accent)}

  /* pen hardening: no tap flash, no double-tap zoom, no long-press menu */
  *{-webkit-tap-highlight-color:transparent}
  button,select,.chk,.preset{touch-action:manipulation}
  #panel{touch-action:pan-y}

  .chk{display:flex;align-items:center;gap:7px;margin-bottom:5px;color:var(--fg-dim);cursor:pointer}
  .chk input{accent-color:var(--accent);width:13px;height:13px;margin:0}
  .chk:hover{color:var(--fg)}

  select,button.btn{background:var(--panel-2);color:var(--fg);border:1px solid var(--line-2);
       border-radius:var(--radius);padding:4px 7px;font:inherit;cursor:pointer}
  button.btn:hover,select:hover{border-color:#4b545c;background:#282c30}
  .btn-row{display:flex;gap:6px}
  .btn-row .btn{flex:1;text-align:center}

  /* colour */
  #sv{width:100%;height:112px;border-radius:var(--radius);display:block;cursor:crosshair;touch-action:none}
  #hue{width:100%;height:13px;border-radius:var(--radius);display:block;margin-top:6px;cursor:crosshair;touch-action:none}
  #swatches{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin-top:8px}
  .sw{aspect-ratio:1;border-radius:3px;border:1px solid #00000055;cursor:pointer}
  .sw:hover{outline:1px solid var(--fg)}
  #hex{width:100%;margin-top:6px;background:var(--panel-2);border:1px solid var(--line-2);
       color:var(--fg);border-radius:var(--radius);padding:4px 7px;font:inherit;
       font-family:ui-monospace,Consolas,monospace;text-align:center}

  /* preset strip */
  #presets{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  .preset{background:var(--panel-2);border:1px solid var(--line-2);border-radius:var(--radius);
          padding:5px 2px;font-size:10px;color:var(--fg-dim);cursor:pointer}
  .preset:hover{color:var(--fg);border-color:#4b545c}
  .preset[aria-pressed="true"]{border-color:#4d7fce;background:var(--accent-dim);color:#eaf1ff}

  /* ---------- status bar / telemetry ---------- */
  #status{grid-area:status;background:var(--panel);border-top:1px solid var(--line);
          display:flex;align-items:center;gap:14px;padding:0 10px;
          font-size:11px;color:var(--fg-dim);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
  #status b{font-weight:500;color:var(--fg-faint)}
  #status span{color:var(--fg)}
  .meter{width:74px;height:6px;background:var(--line-2);border-radius:6px;overflow:hidden;flex:none}
  .meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .04s linear}
  .st-spacer{flex:1}
  #ptype{padding:0 6px;border:1px solid var(--line-2);border-radius:99px;font-size:10px;color:var(--fg-dim)}
  #ptype.pen{border-color:#4d7fce;color:#9cc2ff}

  @media (max-width:900px){
    body{grid-template-columns:44px 1fr;grid-template-areas:"tools stage" "status status"}
    #panel{position:absolute;right:0;top:0;bottom:24px;width:232px;z-index:5;box-shadow:-8px 0 24px #0008}
    #panel.hidden{display:none}
  }
</style>
</head>
<body>

<div id="rail">
  <button class="tool" id="t-brush" data-tool="brush" title="Brush (B)" aria-pressed="true">
    <svg viewBox="0 0 24 24"><path d="M4 20c3 1 5-1 5-3.5S7.5 13 6 14.5 4 20 4 20Z"/><path d="M10.5 15.5 20 6a1.8 1.8 0 0 0-2.5-2.5L8 13"/></svg></button>
  <button class="tool" id="t-eraser" data-tool="eraser" title="Eraser (E)" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="M8 20h12"/><path d="m4.5 16.5 6-6a2 2 0 0 1 2.8 0l4.2 4.2a2 2 0 0 1 0 2.8L15 20H8l-3.5-3.5Z"/></svg></button>
  <button class="tool" id="t-pick" data-tool="pick" title="Eyedropper (I, or hold Alt)" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="m13 7 4 4"/><path d="M15 5.5 18.5 9 9 18.5l-4 1 1-4L15 5.5Z"/></svg></button>
  <div class="rail-sep"></div>
  <button class="tool" id="t-undo" title="Undo (Ctrl+Z)">
    <svg viewBox="0 0 24 24"><path d="M4 9h10a5 5 0 0 1 0 10H9"/><path d="m8 5-4 4 4 4"/></svg></button>
  <button class="tool" id="t-redo" title="Redo (Ctrl+Shift+Z)">
    <svg viewBox="0 0 24 24"><path d="M20 9H10a5 5 0 0 0 0 10h5"/><path d="m16 5 4 4-4 4"/></svg></button>
  <div class="rail-sep"></div>
  <button class="tool" id="t-fit" title="Fit to screen (F) · 100% is 1 · Reset view is 0">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg></button>
  <div class="rail-spacer"></div>
  <button class="tool" id="t-clear" title="Clear canvas">
    <svg viewBox="0 0 24 24"><path d="M5 7h14"/><path d="M9 7V5h6v2"/><path d="m7 7 1 13h8l1-13"/></svg></button>
  <button class="tool" id="t-save" title="Export PNG (Ctrl+S)">
    <svg viewBox="0 0 24 24"><path d="M12 4v10"/><path d="m8 10 4 4 4-4"/><path d="M5 18h14"/></svg></button>
</div>

<div id="stage">
  <canvas id="view"></canvas>
  <div id="hint">Draw with a pen or mouse · wheel = zoom · space-drag = pan · alt-wheel = rotate</div>
</div>

<div id="panel">
  <div class="sec">
    <h2>Preset</h2>
    <div id="presets"></div>
  </div>

  <div class="sec">
    <h2>Brush</h2>
    <div class="sl" id="sl-size"></div>
    <div class="sl" id="sl-hard"></div>
    <div class="sl" id="sl-opac"></div>
    <div class="sl" id="sl-flow"></div>
    <div class="sl" id="sl-space"></div>
  </div>

  <div class="sec">
    <h2>Pen dynamics</h2>
    <label class="chk"><input type="checkbox" id="d-size"> Pressure → size</label>
    <label class="chk"><input type="checkbox" id="d-opac"> Pressure → opacity</label>
    <div class="sl" id="sl-curve"></div>
    <div class="sl" id="sl-minsz"></div>
    <label class="chk"><input type="checkbox" id="d-tilt"> Tilt → size (flatten)</label>
  </div>

  <div class="sec">
    <h2>Stroke</h2>
    <div class="sl" id="sl-stab"></div>
    <label class="chk"><input type="checkbox" id="d-speed"> Speed → size (taper)</label>
    <label class="chk"><input type="checkbox" id="mousepressure"> Simulate pressure for mouse</label>
  </div>

  <div class="sec">
    <h2>Colour</h2>
    <canvas id="sv" width="200" height="112"></canvas>
    <canvas id="hue" width="200" height="13"></canvas>
    <input id="hex" spellcheck="false" maxlength="7">
    <div id="swatches"></div>
  </div>

  <div class="sec">
    <h2>Canvas</h2>
    <div class="btn-row">
      <button class="btn" id="bg-white">White</button>
      <button class="btn" id="bg-paper">Paper</button>
      <button class="btn" id="bg-none">Clear</button>
    </div>
  </div>
</div>

<div id="status">
  <b>pen</b><span id="ptype" title="'pen' = Windows Ink is delivering real pressure. 'mouse' = your tablet is in Wintab/mouse mode; turn on 'Use Windows Ink' in the tablet driver.">—</span>
  <b>P</b><div class="meter"><i id="m-press"></i></div><span id="v-press">0.00</span>
  <b>tilt</b><span id="v-tilt">0°/0°</span>
  <b>twist</b><span id="v-twist">0°</span>
  <div class="st-spacer"></div>
  <b>pos</b><span id="v-pos">—</span>
  <b>zoom</b><span id="v-zoom">100%</span>
  <b>rot</b><span id="v-rot">0°</span>
  <b>hz</b><span id="v-hz">0</span>
  <b>fps</b><span id="v-fps">0</span>
</div>

<script>
"use strict";
/* =========================================================================
   Inkwell — a painting prototype
   -------------------------------------------------------------------------
   Layout of this file, top to bottom:
     1. document model     (the artwork; independent of what's on screen)
     2. view transform     (pan / zoom / rotate — a camera over the document)
     3. brush engine       (tip sprite, dab stamping, spline + spacing)
     4. input              (pointer events, coalescing, stabiliser, gestures)
     5. history            (bbox-scoped undo)
     6. renderer           (rAF; composites document + live stroke)
     7. ui                 (panel wiring, colour picker, shortcuts)
   ========================================================================= */

const $  = s => document.querySelector(s);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp  = (a,b,t) => a+(b-a)*t;

/* ========================== 1. DOCUMENT MODEL ============================ */
/* The artwork lives here, at its own resolution, and knows nothing about the
   screen. The visible canvas is only ever a view onto it. Layers would slot in
   as an array of these; tiling would slot in underneath. */

const DOC_W = 2048, DOC_H = 1400;

function makeSurface(w,h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d', {willReadFrequently:false});
  x.imageSmoothingQuality = 'high';
  return {canvas:c, ctx:x};
}

const layer  = makeSurface(DOC_W, DOC_H);   // committed pixels
const strokeBuf = makeSurface(DOC_W, DOC_H); // live stroke (wash accumulation)
const backup = makeSurface(DOC_W, DOC_H);   // pre-stroke copy, for undo

/* ============================ 2. VIEW ==================================== */

const view = {cx:DOC_W/2, cy:DOC_H/2, scale:1, rot:0};
let vw = 0, vh = 0, dpr = 1;

function screenToDoc(sx,sy){
  const dx = (sx - vw/2)/view.scale, dy = (sy - vh/2)/view.scale;
  const c = Math.cos(-view.rot), s = Math.sin(-view.rot);
  return {x: view.cx + dx*c - dy*s, y: view.cy + dx*s + dy*c};
}
function docToScreen(x,y){
  const dx = x-view.cx, dy = y-view.cy;
  const c = Math.cos(view.rot), s = Math.sin(view.rot);
  return {x: vw/2 + (dx*c - dy*s)*view.scale, y: vh/2 + (dx*s + dy*c)*view.scale};
}
/* pin a document point to a screen point — the basis of zoom-at-cursor and pinch */
function anchor(docPt, scrPt){
  const dx = (scrPt.x - vw/2)/view.scale, dy = (scrPt.y - vh/2)/view.scale;
  const c = Math.cos(-view.rot), s = Math.sin(-view.rot);
  view.cx = docPt.x - (dx*c - dy*s);
  view.cy = docPt.y - (dx*s + dy*c);
}
function fitView(){
  view.scale = Math.min(vw/DOC_W, vh/DOC_H) * 0.92;
  view.cx = DOC_W/2; view.cy = DOC_H/2; view.rot = 0; dirty();
}

/* ========================== 3. BRUSH ENGINE ============================== */

const brush = {
  size:34, hardness:0.55, opacity:1, flow:0.55, spacing:0.06,
  pSize:true, pOpacity:false, curve:1.0, minSize:0.08,
  tiltSize:false, speedSize:false, stabilise:0.35,
  colour:'#1b1f24', mousePressure:false
};
let tool = 'brush';

/* Brush tip is pre-rendered once into a sprite and blitted per dab. Building a
   radial gradient per dab is what makes naive canvas painting crawl. */
const TIP = 256;
const tipMask = makeSurface(TIP,TIP);   // white-on-transparent alpha profile
const tipInk  = makeSurface(TIP,TIP);   // tinted copy actually stamped
let tipDirty = true;

function buildTip(){
  const m = tipMask.ctx, r = TIP/2;
  m.clearRect(0,0,TIP,TIP);
  const h = clamp(brush.hardness, 0, 0.985);
  const g = m.createRadialGradient(r,r,0, r,r,r);
  const N = 32;
  for(let i=0;i<=N;i++){
    const t = i/N;
    let a;
    if(t <= h) a = 1;
    else { const u = (t-h)/(1-h); a = 1 - u*u*(3-2*u); }   // smoothstep falloff
    g.addColorStop(t, `rgba(255,255,255,${a})`);
  }
  m.fillStyle = g; m.fillRect(0,0,TIP,TIP);

  const k = tipInk.ctx;
  k.globalCompositeOperation = 'source-over';
  k.clearRect(0,0,TIP,TIP);
  k.fillStyle = brush.colour; k.fillRect(0,0,TIP,TIP);
  k.globalCompositeOperation = 'destination-in';
  k.drawImage(tipMask.canvas, 0, 0);
  k.globalCompositeOperation = 'source-over';
  tipDirty = false;
}

/* --- live stroke state --- */
const stroke = {
  active:false, pointerId:-1, erasing:false,
  pts:[], seg:0, carry:0,          // stabilised samples + arc-length carry
  minX:1e9, minY:1e9, maxX:-1e9, maxY:-1e9,
  sx:0, sy:0, sp:0,                // stabiliser state
  lastT:0, speed:0
};

function growBounds(x,y,r){
  if(x-r < stroke.minX) stroke.minX = x-r;
  if(y-r < stroke.minY) stroke.minY = y-r;
  if(x+r > stroke.maxX) stroke.maxX = x+r;
  if(y+r > stroke.maxY) stroke.maxY = y+r;
}

function radiusFor(p, tilt){
  let f = 1;
  if(brush.pSize) f = brush.minSize + (1-brush.minSize)*Math.pow(p, brush.curve);
  if(brush.tiltSize && tilt !== undefined) f *= lerp(1, 0.45, tilt);
  if(brush.speedSize) f *= clamp(1 - stroke.speed*0.0022, 0.35, 1);
  return Math.max(0.35, brush.size*0.5*f);
}
function alphaFor(p){
  let a = brush.flow;
  if(brush.pOpacity) a *= Math.pow(p, brush.curve);
  return clamp(a, 0, 1);
}

function dab(x,y,p,tilt){
  if(tipDirty) buildTip();
  const r = radiusFor(p, tilt);
  const a = alphaFor(p);
  if(a <= 0.001) return r;
  const ctx = stroke.erasing ? layer.ctx : strokeBuf.ctx;
  ctx.globalAlpha = stroke.erasing ? a*brush.opacity : a;
  ctx.globalCompositeOperation = stroke.erasing ? 'destination-out' : 'source-over';
  ctx.drawImage(tipInk.canvas, x-r, y-r, r*2, r*2);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  growBounds(x,y,r);
  return r;
}

/* Catmull-Rom through the stabilised samples, walked by arc length so dabs land
   at even spacing regardless of how fast the pen was moving. */
const cr = (a,b,c,d,t) => {
  const t2=t*t, t3=t2*t;
  return 0.5*((2*b) + (-a+c)*t + (2*a-5*b+4*c-d)*t2 + (-a+3*b-3*c+d)*t3);
};

function emitSegment(p0,p1,p2,p3){
  const chord = Math.hypot(p2.x-p1.x, p2.y-p1.y);
  const steps = clamp(Math.ceil(chord/1.5), 2, 160);
  let px = p1.x, py = p1.y, pp = p1.p, pt = p1.tilt;
  for(let i=1;i<=steps;i++){
    const t  = i/steps;
    const x  = cr(p0.x,p1.x,p2.x,p3.x,t);
    const y  = cr(p0.y,p1.y,p2.y,p3.y,t);
    const pr = lerp(p1.p, p2.p, t);
    const ti = lerp(p1.tilt, p2.tilt, t);
    let segLen = Math.hypot(x-px, y-py);
    if(segLen > 1e-6){
      let used = 0;
      for(;;){
        const r  = radiusFor(lerp(pp,pr,used/segLen), lerp(pt,ti,used/segLen));
        const sp = Math.max(0.55, r*2*brush.spacing);
        if(stroke.carry + (segLen-used) < sp) break;
        used += Math.max(0, sp - stroke.carry);   // carry can exceed sp when pressure drops
        const f = used/segLen;
        dab(px+(x-px)*f, py+(y-py)*f, lerp(pp,pr,f), lerp(pt,ti,f));
        stroke.carry = 0;
      }
      stroke.carry += segLen - used;
    }
    px=x; py=y; pp=pr; pt=ti;
  }
}

/* Emit whatever segments now have enough neighbours; `final` flushes the tail. */
function pump(final){
  const P = stroke.pts;
  while(stroke.seg + 1 < P.length){
    const i = stroke.seg;
    if(i+2 >= P.length && !final) break;
    emitSegment(P[i-1]||P[i], P[i], P[i+1], P[i+2]||P[i+1]);
    stroke.seg++;
  }
}

/* ============================= 4. INPUT ================================== */

const stage = $('#stage'), cv = $('#view');
const dsp = cv.getContext('2d', {alpha:false, desynchronized:true});

let penSeen = false;                 // once a pen appears, touch stops painting
const touches = new Map();           // active touch pointers, for gestures
let gesture = null;
let spaceDown = false, altDown = false;
let pan = null;
let cursor = {x:-999, y:-999, r:12, inside:false};
let hz = {n:0, t:performance.now()};

function pressureOf(e){
  if(e.pointerType === 'pen'){
    let p = e.pressure;
    if(p <= 0) p = 0.001;
    return clamp(p, 0, 1);
  }
  if(brush.mousePressure){
    // crude but useful for mouse testing: faster = lighter
    return clamp(1 - stroke.speed*0.02, 0.15, 1);
  }
  return 1;
}
function tiltOf(e){
  const tx = e.tiltX||0, ty = e.tiltY||0;
  return clamp(Math.hypot(tx,ty)/90, 0, 1);   // 0 = upright, 1 = flat
}

function beginStroke(e, pt, forceErase){
  stroke.active = true;
  stroke.pointerId = e.pointerId;
  stroke.erasing = forceErase || (tool === 'eraser');
  stroke.pts.length = 0; stroke.seg = 0; stroke.carry = 0;
  stroke.minX = 1e9; stroke.minY = 1e9; stroke.maxX = -1e9; stroke.maxY = -1e9;
  stroke.sx = pt.x; stroke.sy = pt.y; stroke.sp = pressureOf(e);
  stroke.lastT = e.timeStamp; stroke.speed = 0;

  // snapshot the layer GPU-side; we only read back the touched rect at the end
  backup.ctx.globalCompositeOperation = 'copy';
  backup.ctx.drawImage(layer.canvas, 0, 0);
  backup.ctx.globalCompositeOperation = 'source-over';

  addSample(pt.x, pt.y, stroke.sp, tiltOf(e), true);
}

function addSample(x, y, p, tilt, first){
  // stabiliser: the emitted point chases the raw pointer instead of snapping to it
  const k = 1 - brush.stabilise;
  if(first){ stroke.sx = x; stroke.sy = y; stroke.sp = p; }
  else {
    stroke.sx += (x - stroke.sx)*k;
    stroke.sy += (y - stroke.sy)*k;
    stroke.sp += (p - stroke.sp)*Math.min(1, k*1.6);
  }
  const last = stroke.pts[stroke.pts.length-1];
  if(last && Math.hypot(stroke.sx-last.x, stroke.sy-last.y) < 0.05 && !first) return;
  stroke.pts.push({x:stroke.sx, y:stroke.sy, p:stroke.sp, tilt});
}

function endStroke(){
  if(!stroke.active) return;
  stroke.active = false;
  pump(true);

  if(stroke.pts.length === 1){                 // a tap = a single dab
    const q = stroke.pts[0]; dab(q.x, q.y, q.p, q.tilt);
  }
  if(stroke.maxX > stroke.minX){
    if(!stroke.erasing){                       // bake wash buffer at stroke opacity
      const b = rectOf();
      layer.ctx.globalAlpha = brush.opacity;
      layer.ctx.drawImage(strokeBuf.canvas, b.x,b.y,b.w,b.h, b.x,b.y,b.w,b.h);
      layer.ctx.globalAlpha = 1;
      strokeBuf.ctx.clearRect(b.x,b.y,b.w,b.h);
    }
    pushHistory(rectOf());
  }
  stroke.pts.length = 0;
  dirty();
}

function rectOf(){
  const x = clamp(Math.floor(stroke.minX)-2, 0, DOC_W);
  const y = clamp(Math.floor(stroke.minY)-2, 0, DOC_H);
  const w = clamp(Math.ceil(stroke.maxX)+2, 0, DOC_W) - x;
  const h = clamp(Math.ceil(stroke.maxY)+2, 0, DOC_H) - y;
  return {x, y, w:Math.max(1,w), h:Math.max(1,h)};
}

/* ---- pointer plumbing ---- */

cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  if(e.pointerType === 'pen') penSeen = true;
  if(e.pointerType === 'touch'){
    touches.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(touches.size >= 2){ endStroke(); startGesture(); return; }
    if(penSeen){ pan = {x:e.clientX, y:e.clientY, cx:view.cx, cy:view.cy}; return; }
  }
  // barrel button (button 2 / buttons bit 1) navigates instead of opening a menu
  const barrel = e.button === 2 || (e.buttons & 2) !== 0;
  if(e.button === 1 || spaceDown || barrel){
    pan = {x:e.clientX, y:e.clientY, cx:view.cx, cy:view.cy, rot:e.shiftKey};
    return;
  }
  // inverted pen: Pointer Events reports the eraser end as button 5 / buttons bit 5
  const eraserEnd = e.pointerType === 'pen' && (e.button === 5 || (e.buttons & 32) !== 0);
  const pt = screenToDoc(e.clientX - rect.left, e.clientY - rect.top);
  if(!eraserEnd && (tool === 'pick' || altDown)){ pickColour(pt); return; }
  beginStroke(e, pt, eraserEnd);
  dirty();
});

/* pointerrawupdate fires ahead of pointermove and carries the same coalesced
   samples, so we prefer it — but only while it is actually arriving. Falling
   back on a timeout means a device that emits only pointermove still works. */
let lastRawT = -1e9;
function onMove(e, raw){
  const now = performance.now();
  if(raw) lastRawT = now;
  else if(now - lastRawT < 150){ trackHover(e); return; }
  trackHover(e);

  if(gesture && e.pointerType === 'touch'){
    const t = touches.get(e.pointerId);
    if(t){ t.x = e.clientX; t.y = e.clientY; updateGesture(); }
    return;
  }
  if(pan){
    const dx = (e.clientX - pan.x), dy = (e.clientY - pan.y);
    if(pan.rot){ view.rot += dx*0.006; }
    else{
      const c = Math.cos(-view.rot), s = Math.sin(-view.rot);
      view.cx = pan.cx - (dx*c - dy*s)/view.scale;
      view.cy = pan.cy - (dx*s + dy*c)/view.scale;
    }
    dirty(); return;
  }
  if(!stroke.active || e.pointerId !== stroke.pointerId) return;

  const evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
  const list = evs.length ? evs : [e];
  hz.n += list.length;

  for(const ev of list){
    const dt = Math.max(1, ev.timeStamp - stroke.lastT);
    stroke.lastT = ev.timeStamp;
    const pt = screenToDoc(ev.clientX - rect.left, ev.clientY - rect.top);
    const prev = stroke.pts[stroke.pts.length-1];
    if(prev) stroke.speed = lerp(stroke.speed, Math.hypot(pt.x-prev.x, pt.y-prev.y)/dt*16, 0.35);
    addSample(pt.x, pt.y, pressureOf(ev), tiltOf(ev), false);
  }
  pump(false);
  telemetry(e);
  dirty();
}

let rect = {left:0, top:0};
function trackHover(e){
  cursor.x = e.clientX - rect.left; cursor.y = e.clientY - rect.top;
  cursor.inside = true;
  if(!stroke.active) telemetry(e);
  dirty();
}

if('onpointerrawupdate' in window) cv.addEventListener('pointerrawupdate', e => onMove(e,true));
cv.addEventListener('pointermove', e => onMove(e,false));

function up(e){
  touches.delete(e.pointerId);
  if(touches.size < 2 && gesture) gesture = null;
  if(pan) pan = null;
  if(stroke.active && e.pointerId === stroke.pointerId) endStroke();
}
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);
cv.addEventListener('pointerleave', e => { cursor.inside = false; dirty(); });
/* Kill the pen press-and-hold context menu everywhere except real text fields,
   so resting the nib on a control doesn't pop a menu mid-gesture. */
addEventListener('contextmenu', e => { if(e.target.tagName !== 'INPUT') e.preventDefault(); });

cv.addEventListener('wheel', e => {
  e.preventDefault();
  const s = {x:e.clientX-rect.left, y:e.clientY-rect.top};
  if(e.altKey){ view.rot += (e.deltaY>0?1:-1)*0.06; }
  else if(e.ctrlKey){
    setSize(clamp(brush.size * (e.deltaY>0?0.9:1.111), 1, 400));
  } else {
    const before = screenToDoc(s.x, s.y);
    view.scale = clamp(view.scale * (e.deltaY>0 ? 0.88 : 1/0.88), 0.03, 32);
    anchor(before, s);
  }
  dirty();
}, {passive:false});

/* ---- two-finger gesture ---- */
function pair(){ const a=[...touches.values()]; return [a[0],a[1]]; }
function startGesture(){
  const [a,b] = pair(); if(!a||!b) return;
  const mid = {x:(a.x+b.x)/2 - rect.left, y:(a.y+b.y)/2 - rect.top};
  gesture = {
    dist: Math.hypot(b.x-a.x, b.y-a.y),
    ang:  Math.atan2(b.y-a.y, b.x-a.x),
    scale: view.scale, rot: view.rot,
    doc: screenToDoc(mid.x, mid.y)
  };
}
function updateGesture(){
  const [a,b] = pair(); if(!a||!b||!gesture) return;
  const mid = {x:(a.x+b.x)/2 - rect.left, y:(a.y+b.y)/2 - rect.top};
  const d = Math.hypot(b.x-a.x, b.y-a.y);
  const g = Math.atan2(b.y-a.y, b.x-a.x);
  view.scale = clamp(gesture.scale * (d/gesture.dist), 0.03, 32);
  view.rot = gesture.rot + (g - gesture.ang);
  anchor(gesture.doc, mid);
  dirty();
}

/* ============================ 5. HISTORY ================================= */
/* Only the rectangle a stroke actually touched is stored, taken from the
   pre-stroke snapshot. A full-canvas copy per stroke would be ~11 MB here. */

const undoStack = [], redoStack = [];
const HISTORY_BYTES = 512*1024*1024/4;   // soft cap
let historyBytes = 0;

function pushHistory(b){
  const entry = {x:b.x, y:b.y, data: backup.ctx.getImageData(b.x,b.y,b.w,b.h)};
  undoStack.push(entry);
  historyBytes += b.w*b.h;
  redoStack.length = 0;
  while(historyBytes > HISTORY_BYTES && undoStack.length > 1){
    const o = undoStack.shift();
    historyBytes -= o.data.width*o.data.height;
  }
}
function swapInto(stackFrom, stackTo){
  const e = stackFrom.pop(); if(!e) return;
  const cur = layer.ctx.getImageData(e.x, e.y, e.data.width, e.data.height);
  layer.ctx.putImageData(e.data, e.x, e.y);
  stackTo.push({x:e.x, y:e.y, data:cur});
  dirty();
}
const undo = () => swapInto(undoStack, redoStack);
const redo = () => swapInto(redoStack, undoStack);

function fillCanvas(style){
  backup.ctx.globalCompositeOperation = 'copy';
  backup.ctx.drawImage(layer.canvas,0,0);
  backup.ctx.globalCompositeOperation = 'source-over';
  layer.ctx.globalCompositeOperation = 'copy';
  if(style){ layer.ctx.fillStyle = style; layer.ctx.fillRect(0,0,DOC_W,DOC_H); }
  else layer.ctx.clearRect(0,0,DOC_W,DOC_H);
  layer.ctx.globalCompositeOperation = 'source-over';
  stroke.minX=0; stroke.minY=0; stroke.maxX=DOC_W; stroke.maxY=DOC_H;
  pushHistory({x:0,y:0,w:DOC_W,h:DOC_H});
  dirty();
}

/* ============================ 6. RENDERER ================================ */

let needsRedraw = true;
const dirty = () => { needsRedraw = true; };

const checks = (() => {           // transparency checkerboard, as a pattern
  const c = document.createElement('canvas'); c.width = c.height = 16;
  const x = c.getContext('2d');
  x.fillStyle = '#2a2d30'; x.fillRect(0,0,16,16);
  x.fillStyle = '#313539'; x.fillRect(0,0,8,8); x.fillRect(8,8,8,8);
  return c;
})();

function resize(){
  const r = stage.getBoundingClientRect();
  rect = {left:r.left, top:r.top};
  dpr = Math.min(window.devicePixelRatio||1, 2);
  vw = r.width; vh = r.height;
  cv.width = Math.round(vw*dpr); cv.height = Math.round(vh*dpr);
  cv.style.width = vw+'px'; cv.style.height = vh+'px';
  dirty();
}
new ResizeObserver(resize).observe(stage);
addEventListener('scroll', resize, true);

let fpsN = 0, fpsT = performance.now();

function frame(){
  requestAnimationFrame(frame);

  const now = performance.now();
  if(now - fpsT > 500){
    $('#v-fps').textContent = Math.round(fpsN/((now-fpsT)/1000));
    fpsN = 0; fpsT = now;
    $('#v-hz').textContent = Math.round(hz.n/((now-hz.t)/1000)) || 0;
    hz.n = 0; hz.t = now;
  }
  if(!needsRedraw) return;
  needsRedraw = false; fpsN++;

  dsp.setTransform(1,0,0,1,0,0);
  dsp.fillStyle = '#0e0f10';
  dsp.fillRect(0,0,cv.width,cv.height);

  dsp.setTransform(dpr,0,0,dpr,0,0);
  dsp.translate(vw/2, vh/2);
  dsp.rotate(view.rot);
  dsp.scale(view.scale, view.scale);
  dsp.translate(-view.cx, -view.cy);

  // paper shadow + checkerboard
  dsp.save();
  dsp.shadowColor = 'rgba(0,0,0,.55)';
  dsp.shadowBlur = 24/view.scale; dsp.shadowOffsetY = 6/view.scale;
  dsp.fillStyle = '#000'; dsp.fillRect(0,0,DOC_W,DOC_H);
  dsp.restore();
  const pat = dsp.createPattern(checks,'repeat');
  pat.setTransform(new DOMMatrix().scale(1/view.scale));
  dsp.fillStyle = pat; dsp.fillRect(0,0,DOC_W,DOC_H);

  dsp.imageSmoothingEnabled = view.scale < 2.5;
  dsp.drawImage(layer.canvas, 0, 0);
  if(stroke.active && !stroke.erasing){
    dsp.globalAlpha = brush.opacity;
    dsp.drawImage(strokeBuf.canvas, 0, 0);
    dsp.globalAlpha = 1;
  }

  dsp.lineWidth = 1/view.scale;
  dsp.strokeStyle = 'rgba(255,255,255,.14)';
  dsp.strokeRect(0,0,DOC_W,DOC_H);

  // brush outline, drawn in screen space so it never gets blurry
  dsp.setTransform(dpr,0,0,dpr,0,0);
  if(cursor.inside && tool !== 'pick'){
    const r = Math.max(2.5, brush.size*0.5*view.scale);
    dsp.beginPath(); dsp.arc(cursor.x, cursor.y, r, 0, 6.2832);
    dsp.strokeStyle = 'rgba(0,0,0,.6)'; dsp.lineWidth = 3; dsp.stroke();
    dsp.strokeStyle = 'rgba(255,255,255,.85)'; dsp.lineWidth = 1; dsp.stroke();
    if(r > 14){
      dsp.beginPath(); dsp.arc(cursor.x, cursor.y, 1.2, 0, 6.2832);
      dsp.fillStyle = 'rgba(255,255,255,.7)'; dsp.fill();
    }
  }
}
requestAnimationFrame(frame);

/* ============================== 7. UI ==================================== */

function telemetry(e){
  const pen = e.pointerType === 'pen';
  const tag = $('#ptype');
  tag.textContent = e.pointerType;
  tag.className = pen ? 'pen' : '';
  const p = stroke.active ? stroke.sp : (pen ? e.pressure : 0);
  $('#m-press').style.width = (p*100)+'%';
  $('#v-press').textContent = p.toFixed(2);
  $('#v-tilt').textContent = `${e.tiltX|0}°/${e.tiltY|0}°`;
  $('#v-twist').textContent = `${e.twist|0}°`;
  const d = screenToDoc(e.clientX-rect.left, e.clientY-rect.top);
  $('#v-pos').textContent = `${Math.round(d.x)}, ${Math.round(d.y)}`;
  $('#v-zoom').textContent = Math.round(view.scale*100)+'%';
  $('#v-rot').textContent = Math.round(view.rot*180/Math.PI % 360)+'°';
}

/* --- sliders ---------------------------------------------------------------
   Rolled by hand rather than using <input type=range>, for three reasons:
     · touch-action:none + pointer capture = the pen moves it on contact, with
       no drag threshold and no scroll/tap disambiguation delay.
     · gamma mapping, so a 1..400px size slider still has usable resolution
       down at 3px instead of cramming everything into the first 1% of track.
     · shift = fine drag, wheel = nudge, double-click = default, click the
       number to type an exact value. All the things the stock control can't.  */

const pct = v => Math.round(v)+'%';

function makeSlider(host, o){
  host.tabIndex = 0;
  host.innerHTML =
    '<div class="sl-top"><span class="sl-lab"></span><span class="sl-val"></span></div>' +
    '<div class="sl-track"><div class="sl-fill"></div><div class="sl-knob"></div></div>';
  const lab = host.querySelector('.sl-lab'), val = host.querySelector('.sl-val'),
        fill = host.querySelector('.sl-fill'), knob = host.querySelector('.sl-knob'),
        track = host.querySelector('.sl-track');
  lab.textContent = o.label;
  host.title = o.label + ' — drag, shift-drag for fine, wheel to nudge, '
             + 'double-click for default, click the number to type it';

  const g = o.gamma || 1;
  const toPos = v => Math.pow(clamp((v-o.min)/(o.max-o.min), 0, 1), 1/g);
  const toVal = p => {
    let v = o.min + (o.max-o.min)*Math.pow(clamp(p,0,1), g);
    if(o.step) v = Math.round(v/o.step)*o.step;
    return clamp(v, o.min, o.max);
  };
  const paint = () => {
    const p = toPos(o.get());
    fill.style.width = (p*100)+'%';
    knob.style.left  = (p*100)+'%';
    if(val.isConnected) val.textContent = o.fmt(o.get());
  };
  const commit = v => { o.set(clamp(v, o.min, o.max)); paint(); save(); dirty(); };

  let drag = null;
  track.addEventListener('pointerdown', e => {
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    track.setPointerCapture(e.pointerId);
    drag = {r:track.getBoundingClientRect(), startX:e.clientX, startPos:toPos(o.get()), fine:e.shiftKey};
    host.classList.add('drag');
    host.classList.toggle('fine', e.shiftKey);
    // no threshold: the value follows the pen the instant it lands
    if(!e.shiftKey) commit(toVal((e.clientX - drag.r.left)/drag.r.width));
  });
  track.addEventListener('pointermove', e => {
    if(!drag) return;
    if(e.shiftKey !== drag.fine){            // re-anchor when fine mode toggles mid-drag
      drag.fine = e.shiftKey; drag.startX = e.clientX; drag.startPos = toPos(o.get());
      host.classList.toggle('fine', drag.fine);
    }
    commit(toVal(drag.fine
      ? drag.startPos + (e.clientX - drag.startX)/drag.r.width*0.12
      : (e.clientX - drag.r.left)/drag.r.width));
  });
  const end = () => { drag = null; host.classList.remove('drag','fine'); };
  track.addEventListener('pointerup', end);
  track.addEventListener('pointercancel', end);

  host.addEventListener('wheel', e => {
    e.preventDefault();
    commit(toVal(toPos(o.get()) + (e.deltaY>0?-1:1)*(e.shiftKey?0.004:0.02)));
  }, {passive:false});
  host.addEventListener('dblclick', () => commit(o.def));
  host.addEventListener('keydown', e => {
    const d = e.shiftKey ? 0.004 : 0.02;
    if(e.key==='ArrowLeft' ||e.key==='ArrowDown'){ e.preventDefault(); commit(toVal(toPos(o.get())-d)); }
    if(e.key==='ArrowRight'||e.key==='ArrowUp'  ){ e.preventDefault(); commit(toVal(toPos(o.get())+d)); }
  });

  val.addEventListener('click', () => {
    const inp = document.createElement('input');
    inp.className = 'sl-edit';
    inp.value = String(+o.get().toFixed(2));
    val.replaceWith(inp); inp.focus(); inp.select();
    const done = ok => {
      if(ok){ const n = parseFloat(inp.value); if(isFinite(n)) o.set(clamp(n,o.min,o.max)); }
      inp.replaceWith(val); paint(); save(); dirty();
    };
    inp.addEventListener('keydown', e => {
      e.stopPropagation();
      if(e.key === 'Enter')  done(true);
      if(e.key === 'Escape') done(false);
    });
    inp.addEventListener('blur', () => { if(inp.isConnected) done(true); });
  });

  paint();
  return paint;
}

const sliders = [];
const addSlider = (id, o) => sliders.push(makeSlider($('#'+id), o));

addSlider('sl-size',  {label:'Size', min:1, max:400, gamma:2.4, step:0.1, def:34,
  get:()=>brush.size, set:v=>brush.size=v, fmt:v=>(v<10?v.toFixed(1):Math.round(v))+' px'});
addSlider('sl-hard',  {label:'Hardness', min:0, max:100, step:1, def:55,
  get:()=>brush.hardness*100, set:v=>{brush.hardness=v/100; tipDirty=true;}, fmt:pct});
addSlider('sl-opac',  {label:'Opacity', min:1, max:100, step:1, def:100,
  get:()=>brush.opacity*100, set:v=>brush.opacity=v/100, fmt:pct});
addSlider('sl-flow',  {label:'Flow', min:1, max:100, step:1, def:55, gamma:1.7,
  get:()=>brush.flow*100, set:v=>brush.flow=v/100, fmt:pct});
addSlider('sl-space', {label:'Spacing', min:1, max:50, step:1, def:6, gamma:1.6,
  get:()=>brush.spacing*100, set:v=>brush.spacing=v/100, fmt:pct});
addSlider('sl-curve', {label:'Pressure curve', min:0.3, max:3, step:0.05, def:1,
  get:()=>brush.curve, set:v=>brush.curve=v, fmt:v=>v.toFixed(2)});
addSlider('sl-minsz', {label:'Min size', min:0, max:100, step:1, def:8,
  get:()=>brush.minSize*100, set:v=>brush.minSize=v/100, fmt:pct});
addSlider('sl-stab',  {label:'Stabiliser', min:0, max:95, step:1, def:35,
  get:()=>brush.stabilise*100, set:v=>brush.stabilise=v/100, fmt:pct});

function setSize(v){ brush.size = v; sliders[0](); save(); dirty(); }

function chk(id, key){
  const el = $('#'+id);
  el.checked = brush[key];
  el.addEventListener('change', ()=>{ brush[key] = el.checked; save(); });
  return () => el.checked = brush[key];
}
const syncChk = [
  chk('d-size','pSize'), chk('d-opac','pOpacity'), chk('d-tilt','tiltSize'),
  chk('d-speed','speedSize'), chk('mousepressure','mousePressure')
];
function syncAll(){
  sliders.forEach(f=>f());
  syncChk.forEach(f=>f());
  tipDirty = true;
}

/* --- presets --- */
const PRESETS = {
  'Ink':     {size:8,  hardness:0.92, opacity:1,   flow:1,    spacing:0.03, pSize:true,  pOpacity:false, curve:1.4, minSize:0.05, stabilise:0.45, speedSize:false},
  'Pencil':  {size:5,  hardness:0.35, opacity:0.75,flow:0.35, spacing:0.05, pSize:true,  pOpacity:true,  curve:1.6, minSize:0.25, stabilise:0.2,  speedSize:false},
  'Paint':   {size:52, hardness:0.4,  opacity:1,   flow:0.5,  spacing:0.05, pSize:true,  pOpacity:false, curve:0.9, minSize:0.15, stabilise:0.3,  speedSize:false},
  'Airbrush':{size:120,hardness:0,    opacity:0.9, flow:0.06, spacing:0.03, pSize:false, pOpacity:true,  curve:1.8, minSize:0.1,  stabilise:0.15, speedSize:false}
};
const presetBox = $('#presets');
Object.keys(PRESETS).forEach(name => {
  const b = document.createElement('button');
  b.className = 'preset'; b.textContent = name; b.setAttribute('aria-pressed','false');
  b.onclick = () => {
    Object.assign(brush, PRESETS[name]);
    [...presetBox.children].forEach(c=>c.setAttribute('aria-pressed', String(c===b)));
    syncAll(); save(); dirty();
  };
  presetBox.append(b);
});

/* --- tools --- */
function setTool(t){
  tool = t;
  document.querySelectorAll('[data-tool]').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.tool === t)));
  cv.style.cursor = (t === 'pick') ? 'crosshair' : 'none';
  dirty();
}
document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
$('#t-undo').onclick = undo;
$('#t-redo').onclick = redo;
$('#t-fit').onclick  = fitView;
$('#t-clear').onclick = () => fillCanvas(null);
$('#t-save').onclick = exportPNG;
$('#bg-white').onclick = () => fillCanvas('#ffffff');
$('#bg-paper').onclick = () => fillCanvas('#f2ece0');
$('#bg-none').onclick  = () => fillCanvas(null);

function exportPNG(){
  layer.canvas.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'inkwell-' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.png';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
}

/* --- colour picker (HSV) --- */
const svc = $('#sv'), svx = svc.getContext('2d');
const huec = $('#hue'), huex = huec.getContext('2d');
let H = 32, S = 0.10, V = 0.91;

function hsv2rgb(h,s,v){
  const c = v*s, x = c*(1-Math.abs((h/60)%2-1)), m = v-c;
  const t = h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
  return t.map(n => Math.round((n+m)*255));
}
const hex = (r,g,b) => '#' + [r,g,b].map(n=>n.toString(16).padStart(2,'0')).join('');

function drawPicker(){
  svx.fillStyle = `hsl(${H},100%,50%)`; svx.fillRect(0,0,svc.width,svc.height);
  let g = svx.createLinearGradient(0,0,svc.width,0);
  g.addColorStop(0,'#fff'); g.addColorStop(1,'rgba(255,255,255,0)');
  svx.fillStyle = g; svx.fillRect(0,0,svc.width,svc.height);
  g = svx.createLinearGradient(0,0,0,svc.height);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'#000');
  svx.fillStyle = g; svx.fillRect(0,0,svc.width,svc.height);
  const px = S*svc.width, py = (1-V)*svc.height;
  svx.beginPath(); svx.arc(px,py,5,0,6.2832);
  svx.strokeStyle='#000'; svx.lineWidth=3; svx.stroke();
  svx.strokeStyle='#fff'; svx.lineWidth=1.5; svx.stroke();

  const hg = huex.createLinearGradient(0,0,huec.width,0);
  for(let i=0;i<=6;i++) hg.addColorStop(i/6, `hsl(${i*60},100%,50%)`);
  huex.fillStyle = hg; huex.fillRect(0,0,huec.width,huec.height);
  const hx = H/360*huec.width;
  huex.beginPath(); huex.rect(hx-2,0,4,huec.height);
  huex.strokeStyle='#000'; huex.lineWidth=3; huex.stroke();
  huex.strokeStyle='#fff'; huex.lineWidth=1.5; huex.stroke();
}
function applyColour(){
  const [r,g,b] = hsv2rgb(H,S,V);
  brush.colour = hex(r,g,b);
  tipDirty = true;
  $('#hex').value = brush.colour;
  drawPicker(); save();
}
function dragCanvas(el, fn){
  el.addEventListener('pointerdown', e => {
    el.setPointerCapture(e.pointerId);
    const go = ev => { const r = el.getBoundingClientRect();
      fn(clamp((ev.clientX-r.left)/r.width,0,1), clamp((ev.clientY-r.top)/r.height,0,1)); };
    go(e);
    const mv = ev => go(ev);
    const up = () => { el.removeEventListener('pointermove',mv); el.removeEventListener('pointerup',up); };
    el.addEventListener('pointermove',mv); el.addEventListener('pointerup',up);
  });
}
dragCanvas(svc,  (x,y) => { S = x; V = 1-y; applyColour(); });
dragCanvas(huec, (x)   => { H = x*360;      applyColour(); });
$('#hex').addEventListener('change', e => {
  const m = /^#?([0-9a-f]{6})$/i.exec(e.target.value.trim());
  if(!m) { $('#hex').value = brush.colour; return; }
  setFromHex('#'+m[1]);
});
function setFromHex(h){
  const r = parseInt(h.slice(1,3),16)/255, g = parseInt(h.slice(3,5),16)/255, b = parseInt(h.slice(5,7),16)/255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx-mn;
  V = mx; S = mx ? d/mx : 0;
  H = !d ? 0 : mx===r ? 60*(((g-b)/d)%6) : mx===g ? 60*((b-r)/d+2) : 60*((r-g)/d+4);
  if(H<0) H += 360;
  applyColour();
}
const SWATCHES = ['#000000','#3a3a3a','#6e6e6e','#a8a8a8','#ffffff','#8b2f2f','#c0562e','#d8a13a',
                  '#6f8f3f','#2f6b63','#31567e','#4d3f7a','#8a4a6d','#e8e4dc','#f2ece0','#1b1f24',
                  '#c98d6b','#7a5230'];
SWATCHES.forEach(c => {
  const d = document.createElement('div');
  d.className = 'sw'; d.style.background = c; d.title = c;
  d.onclick = () => setFromHex(c);
  $('#swatches').append(d);
});

function pickColour(pt){
  const x = clamp(Math.round(pt.x),0,DOC_W-1), y = clamp(Math.round(pt.y),0,DOC_H-1);
  const d = layer.ctx.getImageData(x,y,1,1).data;
  if(d[3] === 0) return;
  setFromHex(hex(d[0],d[1],d[2]));
  if(tool === 'pick') setTool('brush');
}

/* --- keyboard --- */
addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT' && e.target.type === 'text') return;
  const k = e.key.toLowerCase();
  if(e.ctrlKey || e.metaKey){
    if(k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if(k === 'y'){ e.preventDefault(); redo(); return; }
    if(k === 's'){ e.preventDefault(); exportPNG(); return; }
    return;
  }
  if(e.code === 'Space'){ spaceDown = true; e.preventDefault(); }
  if(e.altKey) altDown = true;
  if(k === 'b') setTool('brush');
  if(k === 'e') setTool('eraser');
  if(k === 'i') setTool('pick');
  if(k === '[') setSize(Math.max(1, Math.round(brush.size*0.85)));
  if(k === ']') setSize(Math.min(400, Math.round(brush.size*1.18)+1));
  if(k === 'f') fitView();
  if(k === '0'){ view.rot = 0; fitView(); }
  if(k === '1'){ view.scale = 1; view.rot = 0; dirty(); }
  if(k === 'x'){ /* reserved: swap colours */ }
});
addEventListener('keyup', e => {
  if(e.code === 'Space') spaceDown = false;
  if(!e.altKey) altDown = false;
});

/* --- persistence of brush settings (not the artwork) --- */
function save(){
  try{ localStorage.setItem('inkwell.brush', JSON.stringify(brush)); }catch{}
}
try{
  const s = JSON.parse(localStorage.getItem('inkwell.brush')||'null');
  if(s) Object.assign(brush, s);
}catch{}

/* --- boot --- */
setFromHex(brush.colour);
syncAll();
setTool('brush');
buildTip();
resize();
fitView();
fillCanvas('#f2ece0');
undoStack.length = 0; historyBytes = 0;      // don't let the initial fill be undoable
setTimeout(()=>{ $('#hint').style.opacity = 0; }, 6000);
</script>
</body>
